name: iOS compile check (hosted runner)
on:
  push:
    branches: [iphone12-bc-fallback]
  workflow_dispatch:
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode on the runner
        run: ls -d /Applications/Xcode* ; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version
      - name: BC decoder builds clean
        run: cc -O2 -Wall -Wextra -Werror -Wno-unused-parameter -o /tmp/bcdump dm/gfx/tex/tests/bcdump.c dm/gfx/tex/bc_decode.c
      - name: iOS host sources compiled for the iPhone SDK
        env:
          GAME: 010015100B514000
        run: python3 dm/ios/tools/compile_check.py 2>&1 | tee ios-compile.log
